name: RUWA Browser QA

on:
  push:
    branches:
      - feature/elite-whitening-world-class-2026
    paths:
      - "whitening-2026.html"
      - "index.html"
      - "whitening-preview.html"
      - "preview/ruwa/index.html"
      - "README.md"
      - "package.json"
      - "WHITENING-2026-DESIGN-SYSTEM.md"
      - "portfolio/ruwa-dental-whitening/**"
      - "assets/**"
      - "tests/**"
      - ".github/workflows/whitening-2026-browser-qa.yml"
      - ".github/workflows/pages.yml"
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
    paths:
      - "whitening-2026.html"
      - "index.html"
      - "whitening-preview.html"
      - "preview/ruwa/index.html"
      - "README.md"
      - "package.json"
      - "WHITENING-2026-DESIGN-SYSTEM.md"
      - "portfolio/ruwa-dental-whitening/**"
      - "assets/**"
      - "tests/**"
      - ".github/workflows/whitening-2026-browser-qa.yml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: ruwa-browser-qa
  cancel-in-progress: true

jobs:
  design-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the staged landing page
        uses: actions/checkout@v4

      - name: Verify the approved RUWA Hero image is unchanged
        shell: bash
        run: |
          expected="11209e185ca8d671f74e54eda8fdefb1d42382d2"
          actual="$(git rev-parse HEAD:assets/ruwa-hero-90-768.webp)"
          echo "Approved Hero image blob: $actual"
          if [ "$actual" != "$expected" ]; then
            echo "The approved Hero image asset was modified or replaced."
            echo "Expected: $expected"
            echo "Actual:   $actual"
            exit 1
          fi
          echo "The approved Hero image asset is byte-for-byte unchanged."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify RUWA page, aliases, contact channels, and documentation stay consistent
        run: npm run test:ruwa:consistency

      - name: Install the repository's existing test tools
        run: npm install --no-fund

      - name: Audit installed dependencies
        run: npm audit --audit-level=high

      - name: Install Chromium for Playwright browser checks
        run: npx playwright install --with-deps chromium

      - name: Start a compression-enabled local preview server
        run: |
          cat > /tmp/ruwa-gzip-server.py <<'PY'
          import gzip
          import io
          import os
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path

          class GzipStaticHandler(SimpleHTTPRequestHandler):
              compressed_extensions = {".html", ".css", ".js", ".svg", ".xml", ".json"}

              def send_head(self):
                  path = self.translate_path(self.path)
                  accepts_gzip = "gzip" in self.headers.get("Accept-Encoding", "")
                  if accepts_gzip and os.path.isfile(path) and Path(path).suffix.lower() in self.compressed_extensions:
                      payload = gzip.compress(Path(path).read_bytes(), compresslevel=9, mtime=0)
                      self.send_response(200)
                      self.send_header("Content-Type", self.guess_type(path))
                      self.send_header("Content-Encoding", "gzip")
                      self.send_header("Vary", "Accept-Encoding")
                      self.send_header("Content-Length", str(len(payload)))
                      self.end_headers()
                      return io.BytesIO(payload)
                  return super().send_head()

          ThreadingHTTPServer(("127.0.0.1", 4173), GzipStaticHandler).serve_forever()
          PY
          python3 /tmp/ruwa-gzip-server.py > /tmp/ruwa-http.log 2>&1 &
          echo $! > /tmp/ruwa-gzip-server.pid
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/whitening-2026.html -o /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/ruwa-http.log
            exit 1
          fi
          headers="$(curl --fail --silent --head -H "Accept-Encoding: gzip" http://127.0.0.1:4173/whitening-2026.html)"
          printf '%s\n' "$headers"
          printf '%s\n' "$headers" | tr -d '\r' | grep -qi "Content-Encoding: gzip" || {
            echo "The local preview server did not return gzip-encoded HTML."
            cat /tmp/ruwa-http.log
            exit 1
          }

      - name: Capture and audit every RUWA content section across desktop, tablet and mobile
        env:
          BASE_URL: http://127.0.0.1:4173/whitening-2026.html
        run: node tests/whitening-full-page-visual-audit.mjs

      - name: Verify complete RUWA Hero visibility above the fold at eight viewport sizes
        env:
          BASE_URL: http://127.0.0.1:4173/whitening-2026.html
        run: node tests/whitening-hero-fold-qa.mjs

      - name: Verify responsive card, icon, image, glass-panel and FAQ hover interactions
        env:
          BASE_URL: http://127.0.0.1:4173/whitening-2026.html
        run: node tests/whitening-2026-hover-qa.mjs

      - name: Verify native scrolling, GSAP reveals, ScrollTrigger and reduced-motion behavior
        env:
          BASE_URL: http://127.0.0.1:4173/whitening-2026.html
        run: node tests/whitening-2026-scroll-motion-qa.mjs

      - name: Run browser checks at mobile, tablet and desktop sizes
        env:
          BASE_URL: http://127.0.0.1:4173/whitening-2026.html
        run: node tests/whitening-2026-browser-qa.mjs

      - name: Verify the immutable public RUWA preview in desktop Chromium
        env:
          PUBLIC_PREVIEW_URL: https://rawcdn.githack.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/whitening-2026.html
        run: node tests/whitening-2026-public-preview-qa.mjs

      - name: Publish design-phase browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruwa-text-first-hero-browser-qa
          path: artifacts/whitening-2026/
          if-no-files-found: warn
          retention-days: 14
