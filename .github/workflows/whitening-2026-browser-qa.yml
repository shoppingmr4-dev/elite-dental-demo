name: Elite Whitening Browser QA

on:
  push:
    branches:
      - feature/elite-whitening-world-class-2026
    paths:
      - "whitening-2026.html"
      - "assets/**"
      - "tests/whitening-2026-browser-qa.mjs"
      - "tests/whitening-2026-public-preview-qa.mjs"
      - ".github/workflows/whitening-2026-browser-qa.yml"
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
    paths:
      - "whitening-2026.html"
      - "assets/fonts/**"
      - "assets/elite-dental-mark.svg"
      - "tests/whitening-2026-browser-qa.mjs"
      - "tests/whitening-2026-public-preview-qa.mjs"
      - ".github/workflows/whitening-2026-browser-qa.yml"

permissions:
  contents: read

concurrency:
  group: elite-whitening-browser-qa
  cancel-in-progress: false

jobs:
  browser-and-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the staged landing page
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the repository's existing test tools
        run: npm install --no-audit --no-fund

      - name: Install Chromium for Playwright and Lighthouse
        run: npx playwright install --with-deps chromium

      - name: Start a compression-enabled local preview server
        run: |
          python3 - <<'PY' > /tmp/elite-whitening-http.log 2>&1 &
          import gzip
          import io
          import os
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path

          class GzipStaticHandler(SimpleHTTPRequestHandler):
              compressed_extensions = {".html", ".css", ".js", ".svg", ".xml", ".json"}

              def send_head(self):
                  path = self.translate_path(self.path)
                  accepts_gzip = "gzip" in self.headers.get("Accept-Encoding", "")
                  if accepts_gzip and os.path.isfile(path) and Path(path).suffix.lower() in self.compressed_extensions:
                      raw = Path(path).read_bytes()
                      payload = gzip.compress(raw, compresslevel=9, mtime=0)
                      self.send_response(200)
                      self.send_header("Content-Type", self.guess_type(path))
                      self.send_header("Content-Encoding", "gzip")
                      self.send_header("Vary", "Accept-Encoding")
                      self.send_header("Content-Length", str(len(payload)))
                      self.end_headers()
                      return io.BytesIO(payload)
                  return super().send_head()

          ThreadingHTTPServer(("127.0.0.1", 4173), GzipStaticHandler).serve_forever()
          PY
          for attempt in $(seq 1 30); do
            if curl --compressed --fail --silent http://127.0.0.1:4173/whitening-2026.html >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --head -H "Accept-Encoding: gzip" http://127.0.0.1:4173/whitening-2026.html | grep -qi "^Content-Encoding: gzip$"
          cat /tmp/elite-whitening-http.log


      - name: Run browser checks at mobile, tablet and desktop sizes
        env:
          BASE_URL: http://127.0.0.1:4173/whitening-2026.html
        run: node tests/whitening-2026-browser-qa.mjs

      - name: Verify the immutable public RUWA preview in desktop Chromium
        env:
          PUBLIC_PREVIEW_URL: https://rawcdn.githack.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/whitening-2026.html
        run: node tests/whitening-2026-public-preview-qa.mjs

      - name: Configure Lighthouse to use Playwright Chromium
        run: echo "CHROME_PATH=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: Run three controlled mobile Lighthouse audits
        run: |
          mkdir -p artifacts/whitening-2026
          for run in 1 2 3 4 5; do
            echo "Mobile Lighthouse run ${run}/5"
            npx lighthouse http://127.0.0.1:4173/whitening-2026.html --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=html,json --output-path=./artifacts/whitening-2026/lighthouse-mobile-run-${run} --quiet
          done

      - name: Run five mobile Lighthouse audits against the immutable public preview
        env:
          PUBLIC_PREVIEW_URL: https://rawcdn.githack.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/whitening-2026.html
        run: |
          for run in 1 2 3 4 5; do
            echo "Public preview mobile Lighthouse run ${run}/5"
            npx lighthouse "$PUBLIC_PREVIEW_URL" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=html,json --output-path=./artifacts/whitening-2026/lighthouse-public-mobile-run-${run} --quiet
          done

      - name: Run three controlled desktop Lighthouse audits
        run: |
          for run in 1 2 3; do
            echo "Desktop Lighthouse run ${run}/3"
            npx lighthouse http://127.0.0.1:4173/whitening-2026.html --preset=desktop --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=html,json --output-path=./artifacts/whitening-2026/lighthouse-desktop-run-${run} --quiet
          done

      - name: Summarize repeated LCP and Lighthouse metrics
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = 'artifacts/whitening-2026';

          function readRuns(prefix, count) {
            const rows = [];
            for (let run = 1; run <= count; run++) {
              const file = path.join(dir, `${prefix}-run-${run}.report.json`);
              if (!fs.existsSync(file)) continue;
              const report = JSON.parse(fs.readFileSync(file, 'utf8'));
              const audits = report.audits || {};
              const insight = audits['lcp-breakdown-insight']?.details?.items || [];
              const table = insight.find(item => item.type === 'table')?.items || [];
              const node = insight.find(item => item.type === 'node');
              rows.push({
                run,
                scores: Object.fromEntries(['performance','accessibility','best-practices','seo'].map(key => [key, report.categories?.[key]?.score == null ? null : Math.round(report.categories[key].score * 100)])),
                lcpMs: audits['largest-contentful-paint']?.numericValue ?? null,
                fcpMs: audits['first-contentful-paint']?.numericValue ?? null,
                speedIndexMs: audits['speed-index']?.numericValue ?? null,
                tbtMs: audits['total-blocking-time']?.numericValue ?? null,
                cls: audits['cumulative-layout-shift']?.numericValue ?? null,
                lcpSelector: node?.selector ?? null,
                lcpLabel: node?.nodeLabel ?? null,
                lcpBox: node?.boundingRect ?? null,
                lcpBreakdown: table.map(item => ({part:item.subpart, label:item.label, durationMs:item.duration}))
              });
            }
            const values = rows.map(row => row.lcpMs).filter(Number.isFinite).sort((a,b)=>a-b);
            return {runs:rows, medianLcpMs:values.length ? values[Math.floor(values.length / 2)] : null};
          }

          const summary = {
            localCompressedMobile: readRuns('lighthouse-mobile', 5),
            immutablePublicPreviewMobile: readRuns('lighthouse-public-mobile', 5),
            desktop: readRuns('lighthouse-desktop', 3)
          };
          fs.writeFileSync(path.join(dir, 'lighthouse-summary.json'), JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Publish screenshots and quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elite-whitening-browser-qa
          path: artifacts/whitening-2026/
          if-no-files-found: warn
          retention-days: 14
# Run the dedicated visual QA workflow on each reviewed preview revision.
